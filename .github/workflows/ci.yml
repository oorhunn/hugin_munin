name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check C++ formatting
        run: >
          git ls-files '*.cpp' '*.hpp' '*.h' '*.mm' |
          xargs pipx run --spec clang-format==23.1.4 clang-format --dry-run -Werror

  lint:
    name: Lint
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install clang-tidy
        run: pipx install clang-tidy==23.1.4
      - name: Configure
        run: cmake -S . -B build -G Ninja
      - name: Check C++ with clang-tidy
        run: |
          git ls-files '*.cpp' |
            xargs -P 4 -n 1 "$(pipx environment --value PIPX_BIN_DIR)/clang-tidy" --quiet -p build \
              --extra-arg=-isysroot"$(xcrun --show-sdk-path)"

  build:
    name: Build and test (${{ matrix.config }})
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Launch the app
        run: scripts/smoke_test.sh build/HuginMunin.app

  sanitizers:
    name: Sanitizers (${{ matrix.preset }})
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        preset: [asan-ubsan, tsan]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build the tests
        run: cmake --build build/${{ matrix.preset }} --target hm_tests
      - name: Test
        run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure
