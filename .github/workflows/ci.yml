name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check C++ formatting
        run: >
          git ls-files '*.cpp' '*.hpp' '*.h' '*.mm' |
          xargs pipx run --spec clang-format==23.1.4 clang-format --dry-run -Werror

  swift:
    name: Swift format and lint
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Swift formatting and lint
        run: scripts/swift_tools.sh check

  lint:
    name: Lint
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install clang-tidy
        run: pipx install clang-tidy==23.1.4
      - name: Configure
        run: cmake -S . -B build -G Ninja
      - name: Check C++ with clang-tidy
        run: |
          git ls-files '*.cpp' '*.mm' |
            xargs -P 4 -n 1 "$(pipx environment --value PIPX_BIN_DIR)/clang-tidy" --quiet -p build \
              --extra-arg=-isysroot"$(xcrun --show-sdk-path)"

  build:
    name: Build and test (${{ matrix.config }})
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Check supported macOS metadata
        run: python3 scripts/check_macos_compatibility.py build/HuginMunin.app
      - name: Launch the app
        run: scripts/smoke_test.sh build/HuginMunin.app
      - name: Pack the Release build for the older-OS check
        if: matrix.config == 'Release'
        run: scripts/package_build.sh build build-release.tar.gz
      - name: Upload the Release build
        if: matrix.config == 'Release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-build
          path: build-release.tar.gz
          if-no-files-found: error
          retention-days: 3

  older-os:
    # GitHub retired its macOS 14 runners on 2026-11-02, so macOS 15 is the oldest hosted runner.
    # This runs the exact macOS 26 Release build there, without rebuilding it.
    name: Run the Release build on macOS 15
    needs: build
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-build
      - name: Unpack at the path it was built in
        run: tar -xzf build-release.tar.gz
      - name: Test and launch the prebuilt app
        run: scripts/downlevel_check.sh build

  sanitizers:
    name: Sanitizers (${{ matrix.preset }})
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        preset: [asan-ubsan, tsan]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build the tests
        run: cmake --build build/${{ matrix.preset }} --target hm_tests
      - name: Test
        run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure

  coverage:
    name: Core and bridge coverage
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure coverage
        run: cmake --preset coverage
      - name: Build instrumented C++ tests
        run: cmake --build build/coverage --target hm_tests --parallel 2
      - name: Test and generate coverage
        run: python3 scripts/coverage.py
      - name: Publish coverage summary
        if: always()
        run: |
          if [ -f build/coverage/coverage-report/summary.txt ]; then
            echo '### Core and bridge coverage' >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat build/coverage/coverage-report/summary.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-bridge-coverage
          path: build/coverage/coverage-report/
          if-no-files-found: error
          retention-days: 14
