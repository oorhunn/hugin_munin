name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  build:
    name: Build and package
    runs-on: macos-26
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag against the project version
        id: version
        run: |
          version=$(sed -n 's/^project(hugin_munin VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match project version $version in CMakeLists.txt"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Check supported macOS metadata
        run: python3 scripts/check_macos_compatibility.py build/HuginMunin.app
      - name: Launch the app
        run: scripts/smoke_test.sh build/HuginMunin.app
      - name: Package
        run: |
          codesign --verify --deep --strict build/HuginMunin.app
          mkdir dist
          archive="HuginMunin-$VERSION-macos-arm64.zip"
          # ditto keeps the bundle's signature intact, and zip does not always.
          ditto -c -k --keepParent build/HuginMunin.app "dist/$archive"
          (cd dist && shasum -a 256 "$archive" > "$archive.sha256")
      - name: Upload the release archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Pack the build for the older-OS check
        run: scripts/package_build.sh build build-release.tar.gz
      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-build
          path: build-release.tar.gz
          if-no-files-found: error
          retention-days: 7

  older-os:
    # macOS 15 is the oldest GitHub-hosted runner. macOS 14 stays a manual check; see doc/validation.md.
    name: Run the release build on macOS 15
    needs: build
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-build
      - name: Unpack at the path it was built in
        run: tar -xzf build-release.tar.gz
      - name: Test and launch the prebuilt app
        run: scripts/downlevel_check.sh build

  publish:
    name: Publish
    needs: [build, older-os]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # create the GitHub Release
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Check the archive checksum
        run: (cd dist && sha256sum -c ./*.sha256)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" dist/* \
            --verify-tag \
            --prerelease \
            --title "Hugin & Munin $VERSION" \
            --generate-notes \
            --notes "Apple Silicon only. Tested by CI on macOS 26 and macOS 15; macOS 14 is not checked automatically. This build is signed ad hoc, not with a Developer ID, so macOS blocks it after download. See doc/ci-cd.md."
