name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  release:
    name: Build and publish
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: write # create the GitHub Release
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag against the project version
        run: |
          version=$(sed -n 's/^project(hugin_munin VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match project version $version in CMakeLists.txt"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Launch the app
        run: scripts/smoke_test.sh build/HuginMunin.app
      - name: Package
        run: |
          codesign --verify --deep --strict build/HuginMunin.app
          mkdir dist
          archive="HuginMunin-$VERSION-macos-arm64.zip"
          # ditto keeps the bundle's signature intact, and zip does not always.
          ditto -c -k --keepParent build/HuginMunin.app "dist/$archive"
          (cd dist && shasum -a 256 "$archive" > "$archive.sha256")
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" dist/* \
            --verify-tag \
            --prerelease \
            --title "Hugin & Munin $VERSION" \
            --generate-notes \
            --notes "Apple Silicon only. This build is signed ad hoc, not with a Developer ID, so macOS blocks it after download. See doc/ci-cd.md."
